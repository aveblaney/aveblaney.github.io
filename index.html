<script video.js>
  function playAvatarVideo() {
    const video = document.getElementById('avatar-video');
    if (!video) return;

    if (!video.paused) return;

    video.muted = false;
    video.currentTime = 0;
    video.classList.add('playing');

    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.catch(err => {
        console.log('Playback error:', err);
        video.muted = true;
        video.play();
      });
    }

    video.onended = () => {
      video.classList.remove('playing');
    };
  }
</script>

<style>
  :root{

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--ink);

      linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px),

    background-size: 3px 3px, 3px 3px, 180px 180px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 2px solid var(--card-border);
    border-radius: 32px;
    padding: 46px 50px 42px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    overflow: hidden; 
  }

  .lang-switch {
    position: absolute;
    top: 30px;
    right: 34px;
    font-family: 'EB Garamond', serif;
    font-size: 18px;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
  }
  .lang-switch button {
    background: none;
    border: none;
    font: inherit;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 0;
  }
  .lang-switch button.active {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .lang-switch .sep { margin: 0 5px; color: var(--line); }

  .header-row {
    display: flex;
    gap: 22px;
    align-items: flex-start;
    margin-top: 8px;
  }

  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 2px solid var(--card-border);
    object-fit: cover;
    flex-shrink: 0;
    background: #eee;
  }

  .name-block {
    padding-top: 2px;
    min-width: 0; 
    flex: 1 1 auto;
  }

  .name {
    font-size: 30px;
    font-weight: 600;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    margin: 0 0 8px 0;
  }

  .intro {
    font-family: 'Noto Serif JP', 'EB Garamond', serif;
    font-size: 17px;
    color: var(--ink-soft);
    margin: 0 0 12px 0;
    line-height: 1.5;
    max-width: 36ch;
  }

  .song-line {
    display: flex;
    flex-wrap: wrap; 
    align-items: center;
    row-gap: 4px;
    gap: 7px;
    font-size: 16px;
    color: var(--ink-soft);
    font-family: 'EB Garamond', serif;
  }

  .song-line .note { font-size: 16px; }

  .album-art {
    width: 26px;
    height: 26px;
    border-radius: 3px;
    object-fit: cover;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }

  .song-line #song-title {
    font-style: italic;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 2px;
    min-width: 0;
    overflow-wrap: anywhere; 
  }
  .song-line #song-title:hover {
    color: var(--link);
  }

  .reroll-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 50px;
    width: 26px;
    height: 26px;
    font-size: 14px;
    line-height: 1;
    color: var(--ink-soft);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin-left: 2px;
    flex-shrink: 0;
    transition: transform 0.25s ease, background 0.15s ease;
  }
  .reroll-btn:hover { background: var(--line); }
  .reroll-btn.spin { transform: rotate(180deg); }

  /* socials */
  .socials {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 26px 0 32px 0;
  }
  .socials a {
    display: inline-flex;
    width: 40px;
    height: 40px;
    opacity: 0.75;
    transition: opacity 0.15s ease;
  }
  .socials a:hover { opacity: 1; }
  .socials img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  hr.divider {
    border: none;
    border-top: 1px solid var(--line);
    margin: 0 0 18px 0;
  }

  /* updates */
  .updates h2 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 12px 0;
    text-underline-offset: 3px;
  }

  .updates ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

.updates li {
  font-family: 'EB Garamond', 'Noto Serif JP', serif;

}

    color: var(--ink);
    flex-shrink: 0;
  }

  .updates li a {
    color: var(--link);
    text-decoration: underline;
  }

  .updates li .date {
    color: var(--ink-soft);
    font-size: 14px;
    margin-left: auto;
    white-space: nowrap;
    padding-left: 8px;
  }

  [data-i18n], [data-i18n-html] { }
  html[lang="ja"] [data-en-only] { display: none; }
  html[lang="en"] [data-ja-only] { display: none; }

  @media (max-width: 480px) {
    body { padding: 28px 14px; }

    .card { padding: 34px 24px 30px; }

    .socials { justify-content: center; }

    .updates li { justify-content: center; text-align: left; }
    .updates li .date { margin-left: 0; }
  }
</style>

    { title: "ナハトムジーク", artist: "Mrs. GREEN APPLE", cover: "https://aop-emtg-jp.s3.amazonaws.com/prod/public/mga/contents/information/54b9c0b206aa171fdf1bfbeb2364c9de.jpeg", link: "https://www.youtube.com/watch?v=Dsylo684yWA" },
    { title: "yuru camp x the jackson 5", artist: "Triple-Q", cover: "https://i.ytimg.com/vi/GMTaPgnSVu0/maxresdefault.jpg", link: "https://www.youtube.com/watch?v=GMTaPgnSVu0" },
    { title: "petal", artist: "kou", cover: "https://cf.mora.jp/contents/package/0000/00000175/0025/333/227/0025333227.200.jpg", link: "https://www.youtube.com/watch?v=NfyDbwQw5Sg" },
    { title: "Happi", artist: "Mangoo, bby ivy", cover: "https://ncsmusic.s3.eu-west-1.amazonaws.com/tracks/000/000/793/1000x0/happi-1597410025-yoEZsvmqzg.jpg", link: "https://www.youtube.com/watch?v=gQjAEbWZEgU" },
    { title: "Tamaki", artist: "RADWIMPS", cover: "https://i2.wp.com/i.postimg.cc/nzgd5CgJ/22-UM1-IM15510-rgb.jpg?ssl=1", link: "https://www.youtube.com/watch?v=4rC6_P-YQ9E" },
    { title: "すずめの涙", artist: "RADWIMPS", cover: "https://i2.wp.com/i.postimg.cc/nzgd5CgJ/22-UM1-IM15510-rgb.jpg?ssl=1", link: "https://www.youtube.com/watch?v=FxK6QRNsc3Q" },
  ];
  let lastIndex = -1;

  function rerollSong() {
    const btn = document.getElementById('reroll');
    btn.classList.add('spin');
    setTimeout(() => btn.classList.remove('spin'), 300);

    let i;
    do { i = Math.floor(Math.random() * songs.length); } while (i === lastIndex && songs.length > 1);
    lastIndex = i;

    const song = songs[i];
    const songLink = document.getElementById('song-title');
    const coverImg = document.getElementById('album-cover');

    songLink.textContent = `${song.title} — ${song.artist}`;
    songLink.href = song.link;
    coverImg.src = song.cover;
  }

  rerollSong();
</script>
