<!DOCTYPE html>
<html lang="en" id="html-root">
<script video.js>
  function playAvatarVideo() {
    const video = document.getElementById('avatar-video');
    if (!video) return;

    // Unmute on click since this is a user gesture
    video.muted = false;
    video.currentTime = 0;
    
    // Show video and play
    video.classList.add('playing');
    
    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.catch(err => {
        console.log('Playback error:', err);
        // Fallback: play muted if browser blocks audio
        video.muted = true;
        video.play();
      });
    }

    // Fade out back to image once video ends
    video.onended = () => {
      video.classList.remove('playing');
    };
  }
</script>
<head>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>evablan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  :root{
    --bg: #e7dfc9;
    --card: #fdfcf7;
    --ink: #2b2926;
    --ink-soft: #6b655a;
    --line: #d8d0ba;
    --link: #3a5a8c;
    --card-border: #2b2926;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px),
      linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
    background-size: 3px 3px, 3px 3px, 180px 180px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 2px solid var(--card-border);
    border-radius: 32px;
    padding: 46px 50px 42px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    overflow: hidden; /* safety net so nothing can visually escape the rounded border */
  }

  /* language switch */
  .lang-switch {
    position: absolute;
    top: 30px;
    right: 34px;
    font-family: 'EB Garamond', serif;
    font-size: 18px;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
  }
  .lang-switch button {
    background: none;
    border: none;
    font: inherit;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 0;
  }
  .lang-switch button.active {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .lang-switch .sep { margin: 0 5px; color: var(--line); }

  /* header row: avatar + name/intro */
  .header-row {
    display: flex;
    gap: 22px;
    align-items: flex-start;
    margin-top: 8px;
  }

  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 2px solid var(--card-border);
    object-fit: cover;
    flex-shrink: 0;
    background: #eee;
  }

  .name-block {
    padding-top: 2px;
    min-width: 0; /* lets this flex item shrink instead of forcing overflow */
    flex: 1 1 auto;
  }

  .name {
    font-size: 30px;
    font-weight: 600;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    margin: 0 0 8px 0;
  }

  .intro {
    font-family: 'Noto Serif JP', 'EB Garamond', serif;
    font-size: 17px;
    color: var(--ink-soft);
    margin: 0 0 12px 0;
    line-height: 1.5;
    max-width: 36ch;
  }

  .song-line {
    display: flex;
    flex-wrap: wrap; /* was missing — this is what let the row overflow the card on narrow screens */
    align-items: center;
    row-gap: 4px;
    gap: 7px;
    font-size: 16px;
    color: var(--ink-soft);
    font-family: 'EB Garamond', serif;
  }

  .song-line .note { font-size: 16px; }

  .album-art {
    width: 26px;
    height: 26px;
    border-radius: 3px;
    object-fit: cover;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }

  .song-line #song-title {
    font-style: italic;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 2px;
    min-width: 0;
    overflow-wrap: anywhere; /* lets a long title wrap instead of pushing the button off the card */
  }
  .song-line #song-title:hover {
    color: var(--link);
  }

  .reroll-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 50px;
    width: 26px;
    height: 26px;
    font-size: 14px;
    line-height: 1;
    color: var(--ink-soft);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin-left: 2px;
    flex-shrink: 0;
    transition: transform 0.25s ease, background 0.15s ease;
  }
  .reroll-btn:hover { background: var(--line); }
  .reroll-btn.spin { transform: rotate(180deg); }

  /* socials */
  .socials {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 26px 0 32px 0;
  }
  .socials a {
    display: inline-flex;
    width: 40px;
    height: 40px;
    opacity: 0.75;
    transition: opacity 0.15s ease;
  }
  .socials a:hover { opacity: 1; }
  .socials img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  hr.divider {
    border: none;
    border-top: 1px solid var(--line);
    margin: 0 0 18px 0;
  }

  /* updates */
  .updates h2 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 12px 0;
    text-underline-offset: 3px;
  }

  .updates ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

.updates li {
  font-family: 'EB Garamond', 'Noto Serif JP', serif; /* EB Garamond first */
  font-size: 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 9px;
  color: var(--ink);
}

  .updates li .dot {
    font-size: 8px;
    color: var(--ink);
    flex-shrink: 0;
  }

  .updates li a {
    color: var(--link);
    text-decoration: underline;
  }

  .updates li .date {
    color: var(--ink-soft);
    font-size: 14px;
    margin-left: auto;
    white-space: nowrap;
    padding-left: 8px;
  }

  [data-i18n], [data-i18n-html] { }
  html[lang="ja"] [data-en-only] { display: none; }
  html[lang="en"] [data-ja-only] { display: none; }

  /* --- mobile --- */
  @media (max-width: 480px) {
    body { padding: 28px 14px; }

    .card { padding: 34px 24px 30px; }

    /* the language switch moves out of the corner and sits centered above everything */
    .lang-switch {
      position: static;
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* avatar stacks above the name block, and everything centers */
    .header-row {
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }

    .name-block { width: 100%; }

    .intro { margin-left: auto; margin-right: auto; }

    /* the two circled areas: centered instead of left-aligned */
    .song-line { justify-content: center; }
    .socials { justify-content: center; }

    .updates li { justify-content: center; text-align: left; }
    .updates li .date { margin-left: 0; }
  }
</style>
</head>
<body>

<script>

    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-ja').classList.toggle('active', lang === 'ja');

    { title: "iPod Touch (Madeon Remix)", artist: "Ninajirachi", cover: "https://f4.bcbits.com/img/a1078894923_2.jpg", link: "https://www.youtube.com/watch?v=HU1EdQKQV3M" },
    { title: "夏、バス停、君を待つ", artist: "ヨルシカ", cover: "https://m.media-amazon.com/images/I/71F8u8EyVNL.jpg", link: "https://open.spotify.com/track/2JpShP9hy9ZsuHTAG64EH2" },
    { title: "lifeline", artist: "kosu, Jonah Why", cover: "https://i1.sndcdn.com/artworks-ae2qi5ysETzEM618-4K93tQ-t500x500.png", link: "https://www.youtube.com/watch?v=wZCQX4MyMn8" },
    { title: "look for me_chapter133", artist: "harufu", cover: "https://i1.sndcdn.com/artworks-4fK2KelCN0ucihtz-Qh3aNw-t500x500.jpg", link:"https://soundcloud.com/novelchapters/look-for-me_chapter133"},
    { title: "IF U HAVE TO!", artist: "lillybug", cover: "https://f4.bcbits.com/img/a2937793101_2.jpg", link:"https://soundcloud.com/artbyform/lillybug-if-u-have-to"},
    { title: "violet.", artist: "kosu.", cover: "https://i1.sndcdn.com/artworks-00X3hKZtSUjBHrcz-dRZRxA-t500x500.jpg", link:"https://www.youtube.com/watch?v=Fh5y20CIt2s"},
    { title: "モニタリング (ariiol remix)", artist: "DECO*27", cover: "https://i1.sndcdn.com/artworks-9SZ4Dj5rJPsfnQFJ-OIEwlw-t500x500.png", link:"https://www.youtube.com/watch?v=H7ouXbE1Znc"},

    { title: "breakfast", artist: "Mrs. GREEN APPLE", cover: "https://t2.genius.com/unsafe/344x344/https%3A%2F%2Fimages.genius.com%2F1922d5bc8cd6295da0a1efe487f28b78.1000x1000x1.png", link:"https://www.youtube.com/watch?v=uqlQQqvALz0"},
    { title: "謎謎", artist: "RADWIMPS", cover: "https://yt3.googleusercontent.com/Ha828VXNvRumIKTAtnlOOv_CAo4-9fJexzaABUI0DXMmj8GJmWWlnRVq_8OZjvr3gfeIPrc8xrybG5nP2A", link:"https://www.youtube.com/watch?v=2NzfQ8Pq1X4"},

    { title: "芽吹くとき", artist: "yonige", cover: "https://yt3.googleusercontent.com/VOLyfgVvGuUjv0AWYokfpZxK7ioQTWBGwe3cTe6IIzJri3YiF_OcQ64X0fQiRsMGgD-iGeEbtLuSw5wU", link:"https://www.youtube.com/watch?v=e3YbPn7E1ko"},
    { title: "しがないふたり(re-arrange ver.)", artist: "yonige", cover: "https://yt3.googleusercontent.com/VOLyfgVvGuUjv0AWYokfpZxK7ioQTWBGwe3cTe6IIzJri3YiF_OcQ64X0fQiRsMGgD-iGeEbtLuSw5wU", link:"https://www.youtube.com/watch?v=ZQlvPX1wLtk"}
  ];
  let lastIndex = -1;

  function rerollSong() {
    const btn = document.getElementById('reroll');
    btn.classList.add('spin');
    setTimeout(() => btn.classList.remove('spin'), 300);

    let i;
    do { i = Math.floor(Math.random() * songs.length); } while (i === lastIndex && songs.length > 1);
    lastIndex = i;

    const song = songs[i];
    const songLink = document.getElementById('song-title');
    const coverImg = document.getElementById('album-cover');

    songLink.textContent = `${song.title} — ${song.artist}`;
    songLink.href = song.link;
    coverImg.src = song.cover;
  }

  // Load a song randomly right on initial page load
  rerollSong();
</script>
